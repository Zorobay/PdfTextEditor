<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- word bounding box, dashed to read as a detected/drawn OCR region rather than plain UI chrome -->
  <rect x="3" y="6" width="14" height="13" rx="1.5"
        stroke="#222222" stroke-width="1.6" stroke-dasharray="2.6 2.2" />

  <!-- the "W" the box wraps -->
  <text x="10" y="16" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700"
        fill="#222222" text-anchor="middle">W</text>

  <!-- add badge, overlapping the top-right corner of the box -->
  <circle cx="18" cy="6" r="5.4" fill="#ffffff" stroke="#222222" stroke-width="1.4" />
  <line x1="18" y1="3.6" x2="18" y2="8.4" stroke="#222222" stroke-width="1.5" stroke-linecap="round" />
  <line x1="15.6" y1="6" x2="20.4" y2="6" stroke="#222222" stroke-width="1.5" stroke-linecap="round" />
</svg>
